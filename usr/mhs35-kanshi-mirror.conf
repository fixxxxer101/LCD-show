# SUPERSEDED 2026-11-19 by usr/mhs35-kanshi-layout.conf (extended
# layout: HDMI main, panel secondary). Kept for history.
#
# MHS35 mirror profile — one logical desktop, shown identically on
# every connected output (this is what the legacy fbcp setup did,
# and what an extended left/right desktop does NOT do).
#
# Both outputs sit at position 0,0 with the same 480x320 landscape
# mode, so the panel, any HDMI monitor, and Raspberry Pi Connect
# screen sharing all show the same complete desktop.
#
# kanshi notes that shape this file:
#   * the FIRST matching profile in the file wins
#   * a profile matches only when its output count equals the
#     number of connected displays — hence one profile per case
# Trade-off: the shared desktop is 480x320, so an HDMI monitor
# shows the panel-resolution image scaled up by the monitor.
# To go back to an extended desktop, delete this file (a backup
# of any previous config sits next to it as config.bak-*) and
# log out/in, or use the Screen Configuration tool.

profile mhs35-mirror-hdmi1 {
    output SPI-1 enable mode 480x320 position 0,0
    output HDMI-A-1 enable mode 480x320 position 0,0
}

profile mhs35-mirror-hdmi2 {
    output SPI-1 enable mode 480x320 position 0,0
    output HDMI-A-2 enable mode 480x320 position 0,0
}

profile mhs35-mirror-both-hdmi {
    output SPI-1 enable mode 480x320 position 0,0
    output HDMI-A-1 enable mode 480x320 position 0,0
    output HDMI-A-2 enable mode 480x320 position 0,0
}

profile mhs35-panel-only {
    output SPI-1 enable mode 480x320 position 0,0
}
