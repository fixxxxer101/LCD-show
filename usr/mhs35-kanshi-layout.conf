# SUPERSEDED by usr/mhs35-layout.sh (autodetect layout). These
# static profiles pin one specific monitor (1024x768 on HDMI-A-1)
# and white-screened the Pi when it booted without that monitor.
# The desktop setup no longer installs this file; kanshi is given
# a comment-only config instead. Kept for history.
#
# MHS35 desktop layout — HDMI is the main display, the panel is a
# rotated secondary to its right. This is the arrangement verified
# on hardware 2026-11-19 (Pi 5, ViewSonic NX2232w on HDMI-A-1).
#
#   HDMI-A-1  1024x768            position 0,0     (main display:
#                                                  taskbar, menus,
#                                                  default windows)
#   SPI-1     320x480 transform 90 -> 480x320 landscape,
#                                 position 1024,0  (secondary)
#
# kanshi notes that shape this file:
#   * the FIRST matching profile in the file wins
#   * a profile matches only when its output count equals the
#     number of connected displays — hence one profile per case
#   * once the BothScreens virtual output exists (3 outputs) no
#     profile here matches, so kanshi leaves the layout alone
# The 1024x768 mode is that monitor's preferred mode; delete the
# "mode ..." part on the HDMI line to use any other monitor's own
# preferred mode instead (keep position 0,0).

profile mhs35-hdmi1-main {
    output HDMI-A-1 enable mode 1024x768 position 0,0
    output SPI-1 enable mode 320x480 transform 90 position 1024,0
}

profile mhs35-hdmi2-main {
    output HDMI-A-2 enable mode 1024x768 position 0,0
    output SPI-1 enable mode 320x480 transform 90 position 1024,0
}

profile mhs35-panel-only {
    output SPI-1 enable mode 320x480 transform 90 position 0,0
}
